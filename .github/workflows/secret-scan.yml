name: Secret scan

# Source-of-truth secret detection. Runs on every PR and on pushes to main.
# A local gitleaks pre-commit hook is optional fast feedback; this workflow is
# the gate that secrets cannot bypass via `git commit --no-verify`.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      # Pinned deliberately. gitleaks/gitleaks-action@v2 requires a paid
      # licence for organization-owned repositories — it fails closed with
      # "is an organization. License key is required." The gitleaks binary
      # itself is MIT-licensed and free, so we install and run it directly.
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history: the scan covers every commit, not just the diff.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$asset" "${base}/${asset}"
          curl -fsSL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # Verify before executing anything we just downloaded.
          grep " ${asset}\$" checksums.txt | sha256sum -c -
          tar -xzf "$asset" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks "$asset" checksums.txt
          gitleaks version

      - name: Run gitleaks
        # --redact is mandatory: without it a finding prints the matched
        # secret into a public CI log, which turns a near-miss into a leak.
        run: gitleaks git --config .gitleaks.toml --redact --no-banner .
