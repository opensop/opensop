name: CLI tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: bash -n + test.sh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Syntax check and test suite
        run: bash -n cli/bin/opensop && bash cli/test/test.sh
